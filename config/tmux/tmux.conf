
# --- Truecolor (kitty) ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
# tmux-256color's terminfo has no title capability. Without this, a tmux running inside
# another tmux's pane (the remote one over ssh) never titles that pane, and the title is how
# it marks the pane as nested (see "Nested tmux" below). `clipboard` is folded in for a related
# reason: tmux only auto-detects that its client is itself a tmux (and grants OSC52 clipboard
# passthrough) on tmux >= 3.2, via an XTVERSION probe/reply exchanged with the outer tmux; this
# pins it explicitly so a remote on an older tmux (Ubuntu 20.04's 3.0a, Debian 11's 3.1c) still
# relays a nested `"+y`/copy-mode yank outward instead of silently stopping at its own paste
# buffer. No-op on a remote that already auto-detects it.
set -as terminal-features ",tmux*:title:clipboard"

# Undercurl + colored underlines (Neovim LSP diagnostics).
# Smulx/Setulc are custom caps, not covered by terminal-features -> use overrides.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# kitty graphics protocol (image.nvim) through tmux. `on` = visible-pane only
# (`all` has a session-leak bug).
set -g allow-passthrough on

# --- QoL ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000
bind r source-file ~/.tmux.conf \; display "reloaded"

# ctrl-b is a bit awkward for tmux interactions
unbind C-b

# Set tmux activation to ctrl + a
set-option -g prefix C-a
bind-key C-a send-prefix

# Splits + new window: cwd-aware (replaces default | / " binds)
unbind '"'
unbind %
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind  c  new-window     -c "#{pane_current_path}"

##### Detect Neovim #####
# %hidden: a plain VAR=value here would also land in every pane's environment.
%hidden is_vim="ps -o state= -o comm= -t '#{pane_tty}' | \
  grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

##### Navigation (Ctrl-h/j/k/l) #####
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

##### Resize (Alt-h/j/k/l) step = 5 #####
bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 5'
bind-key -n M-j if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 5'
bind-key -n M-k if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 5'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 5'

##### Copy-mode (vi) #####
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

bind-key -T copy-mode-vi M-h resize-pane -L 5
bind-key -T copy-mode-vi M-j resize-pane -D 5
bind-key -T copy-mode-vi M-k resize-pane -U 5
bind-key -T copy-mode-vi M-l resize-pane -R 5

# --- Copy mode: vi + system clipboard (+ OSC52) ---
setw -g mode-keys vi
set  -g set-clipboard on
# Portable OSC52 yank (set-clipboard on pushes to the macOS pasteboard via kitty;
# copy-pipe "pbcopy" would silently no-op over SSH). Over ssh, the remote tmux relays a yank
# outward the same way; the `tmux*:clipboard` terminal-feature up top is what makes that work on
# a remote whose own tmux predates 3.2's auto-detection.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel


# --- Prefixless window switching ---
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-Tab last-window

# --- sesh: full multi-source picker on prefixless C-f (is_vim-guarded) ---
# fzf-tmux -p spawns the popup itself; run-shell drives sesh connect.
bind -n C-f if-shell "$is_vim" "send-keys C-f" {
  run-shell "sesh connect \"$(sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^f find ^d kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' --preview 'sesh preview {}')\""
}
# sesh last: flip to previous session
bind L run-shell "sesh last"

# --- Popups ---
bind g     display-popup -E -d "#{pane_current_path}" -w 88% -h 80% "lazygit"
bind Enter display-popup -E -d "#{pane_current_path}" "tmux new-session -A -s scratch"

# --- Claude Code and omnigent: open current plan in nvim (new window) ---
bind P run-shell "~/.dotfiles/config/tmux/open-plan.sh '#{pane_id}' '#{pane_current_path}'"

# Enable mouse for better usage
set -g mouse on

# Don't let neovim rename windows automatically if they have a custom name associated with them.
set-option -g allow-rename off

# PLUGINS
set -g @plugin 'tmux-plugins/tpm'

# --- Persistence ---
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# --- Nested tmux: a tmux running inside one of our panes (the remote one over ssh) ---
# Local tmux is local, remote tmux is remote: each shows its own windows and agents. While the
# current window's active pane shows a nested tmux, the local 2-row bar collapses to a 1-row
# strip holding only the mode tag, and the agentmux sidebar stays out of that window, so the
# nested tmux's own bar and sidebar are what you see. `prefix p` toggles passthrough.
#
# Detection is a title mark. A tmux whose own client is a tmux (the remote one, seen from its
# side) prefixes the title it sends with "tmux@<host>: " (set-titles-string below), and our
# pane takes that as its pane_title. The shell gate (the same regex agentmux uses) ignores a
# stale mark once the pane is back at a prompt, and config/zsh/lib/title.zsh clears the mark at
# the next prompt on either side: that retitle is what brings the local bar and sidebar back.
# CONTRACT: the mark, title.zsh, the $NESTED branch in status-format[0] and the [80] hooks
# below are one mechanism. Break any one of them and the local bar either stays collapsed or
# never collapses. (agentmux owns hook indices 70-79.)
%hidden NESTED='#{&&:#{m:tmux@*,#{pane_title}},#{!:#{m/r:^-?(zsh|bash|fish|sh|dash|ksh|nu)$,#{pane_current_command}}}}'

# tmux.conf owns the title, because the mark lives in it; agentmux supplies only its fragment
# (falling back to session:window if the plugin is not loaded). kitty, not being a tmux
# client, sees exactly "session:window[ - agent blocked| - agent done]".
set -g @agentmux_titles off
set -g set-titles on
set -g set-titles-string "#{?#{m/r:^(tmux|screen),#{client_termname}},tmux@#{host_short}: ,}#{?@agentmux_title_human,#{E:@agentmux_title_human},#{session_name}:#{window_name}}"
set -g @agentmux_sidebar_skip "$NESTED"

# Row count per session: `status on` (1 row) while its current window's active pane is nested,
# else unset back to the global `status 2`. Only the row count is hook-driven; what the rows
# show is pure format (status-format[0] below). Fork-free, and it emits a `set` only for a
# session whose value is wrong, because every `set status` redraws every client.
set -g @nested_sync "#{S:#{?#{W:#{?window_active,#{P:#{?pane_active,$NESTED,}},}},#{?#{==:#{status},on},,set -t '#{session_id}' status on ; },#{?#{==:#{status},on},set -u -t '#{session_id}' status ; ,}}}"
set-hook -g 'pane-title-changed[80]'     "run-shell -C '#{E:@nested_sync}'"
set-hook -g 'session-window-changed[80]' "run-shell -C '#{E:@nested_sync}'"
set-hook -g 'window-pane-changed[80]'    "run-shell -C '#{E:@nested_sync}'"
set-hook -g 'client-session-changed[80]' "run-shell -C '#{E:@nested_sync}'"
set-hook -g 'client-attached[80]'        "run-shell -C '#{E:@nested_sync}'"
set-hook -g 'pane-exited[80]'            "run-shell -C '#{E:@nested_sync}'"
set-hook -g 'after-kill-pane[80]'        "run-shell -C '#{E:@nested_sync}'"
run-shell -C '#{E:@nested_sync}'

# Passthrough: every key goes to the pane (i.e. the nested tmux) except `C-a p`, which comes
# back. `prefix` is None because the prefix key wins over any key table, and `passthrough` is
# made the default key table because tmux forwards to the pane only the keys its default table
# leaves unbound. It binds C-a alone, so M-1..9, C-h/j/k/l, C-f and the mouse all pass through.
# C-a <key> is re-sent as C-a <key> (`send-keys` with no key re-sends the key that fired the
# binding), so C-a C-a still reaches the nested tmux's send-prefix. `switch-client -T` is
# needed on both edges: changing key-table does not move a client already sitting in a table.
# Replaces the default `p` (previous-window); M-Tab and M-1..9 cover window switching.
bind p {
  if -F '#{pane_in_mode}' 'send -X cancel'
  set prefix None
  set key-table passthrough
  switch-client -T passthrough
  refresh-client -S
}
bind -T passthrough C-a switch-client -T passthrough-prefix
bind -T passthrough-prefix p {
  set -u prefix
  set -u key-table
  switch-client -T root
  refresh-client -S
}
bind -T passthrough-prefix Any { send-keys C-a ; send-keys }

# Mode tag, at the bottom right of whichever local bar is showing: a quiet LOCAL, or a purple
# PASS pill while passthrough is on (client_key_table is passthrough or passthrough-prefix).
# The amber session pill stays the prefix indicator only. A tmux whose own client is a tmux
# (the nested one) drops LOCAL: the strip under it already says who gets the keys. Each
# branch carries its own trailing space so a dropped tag takes no width. Style blocks are
# chained (#[a]#[b]) rather than comma-joined, so nothing inside the #{?} needs a #, escape.
set -g @_mode_tag "#{?#{m:passthrough*,#{client_key_table}},#[fg=#191515]#[bg=#a8a9eb]#[bold] PASS #[default] ,#{?#{m/r:^(tmux|screen),#{client_termname}},,#[fg=#5b5353] LOCAL }}"

# --- Status line: AI-native, hand-rolled (native tmux formats, ~zero subprocess cost) ---
# Monokai Pro Ristretto, matching Kitty, Starship, AeroSpace and Neovim:
#   terminal #403838  editor #2c2525  text #fff1f3  dim #5b5353
#   red #fd6883  orange #f38d70  yellow #f9cc6c  green #adda78
#   cyan #85dacc  purple #a8a9eb
# Every glyph below is verified present in FantasqueSansMNerdFontMono-Regular.ttf's cmap -
# check any new glyph the same way before adding it (see CLAUDE.md footguns).
set -g status on
set -g status 2
set -g status-interval 5
set -g status-style "bg=#403838,fg=#c3b7b8"

# --- line 1 (bottom): session pill (doubles as the prefix indicator) + path / git / ---
# memory / day / time / battery widgets, centered as one block. Flat Nerd Font glyphs
# throughout (not emoji) to match the minimalist macOS-menu-bar look, each widget with its
# own accent color - every widget must set its OWN #[fg=...] rather than relying on a
# neighbor's reset, or it silently inherits the previous separator's dim color. Path, day,
# and time are native formats (zero forks - %d/%H:%M go through strftime the same zero-fork
# way %s does). Git, memory, and battery are the only three subprocesses in the whole bar,
# each a small TTL-cached script (see statusbar/).

# The session pill inverts to amber while the prefix (C-a) is armed - a prefix indicator
# that costs no extra columns, since it restyles something already on the bar.
set -g status-left-length 30
set -g status-left "#[fg=#{?client_prefix,#191515,#f38d70},bg=#{?client_prefix,#f9cc6c,default},bold] #S #[default]"

# --- responsive tiers -------------------------------------------------------------------
# The bar drops widgets (and tightens separators) as the client narrows, so it never
# overflows and gets clipped at the terminal edge.
#
# FOOTGUN: tmux's #{>=:x,y} / #{<:x,y} compare STRINGS, not numbers - "90" >= "100" is
# TRUE and "100" >= "80" is FALSE, both silently wrong. So every width threshold here is an
# arithmetic sign test instead: #{e|-|:width,N} goes negative iff width < N, and #{m:-*,...}
# detects that leading minus. Also note a #{?...} condition kept in an option must be
# referenced as #{?#{E:@opt},a,b}: #{?@opt,a,b} and #{?#{@opt},a,b} test the option's raw
# text, which is never empty, so they are always true. A literal 1/0 typed as the condition is
# looked up as a variable name instead, so #{?1,a,b} is false. Verified on tmux 3.7c.
set -g @_sb_sep "#[fg=#5b5353]#{?#{m:-*,#{e|-|:#{client_width},117}}, │ ,    │    }"

set -g @_sb_path "#[fg=#85dacc] #{b:pane_current_path}"
set -g @_sb_git  "#($HOME/.dotfiles/config/tmux/statusbar/git.sh '#{pane_current_path}')"
# Git plus the separator after it, or nothing at all outside a repo (git.sh prints nothing
# there, which used to leave two separators back to back).
set -g @_sb_gitseg "#{?#{E:@_sb_git},#{E:@_sb_git}#{E:@_sb_sep},}"
set -g @_sb_mem  "#[fg=#adda78]#($HOME/.dotfiles/config/tmux/statusbar/memory.sh)"
set -g @_sb_date "#[fg=#f38d70] %d"
set -g @_sb_time "#[fg=#fff1f3] %H:%M"
set -g @_sb_batt "#($HOME/.dotfiles/config/tmux/statusbar/battery.sh)"

# Each threshold is the width its widgets need (110 / 75 / 50) plus 7 for the mode tag at the
# right end of this row (@_mode_tag, see "Nested tmux"), which the centred block must clear.
# >=117: everything, wide separators.  >=82: everything, tight separators.
# >=57: drop path + day.               <57: time + battery only.
set -g @_sb_full "#{E:@_sb_path}#{E:@_sb_sep}#{E:@_sb_gitseg}#{E:@_sb_mem}#{E:@_sb_sep}#{E:@_sb_date}#{E:@_sb_sep}#{E:@_sb_time}#{E:@_sb_sep}#{E:@_sb_batt}"
set -g @_sb_mid  "#{E:@_sb_gitseg}#{E:@_sb_mem}#{E:@_sb_sep}#{E:@_sb_time}#{E:@_sb_sep}#{E:@_sb_batt}"
set -g @_sb_min  "#{E:@_sb_time}#{E:@_sb_sep}#{E:@_sb_batt}"

set -g status-right-length 200
set -g status-right "#{?#{m:-*,#{e|-|:#{client_width},82}},#{?#{m:-*,#{e|-|:#{client_width},57}},#{E:@_sb_min},#{E:@_sb_mid}},#{E:@_sb_full}} "
set -g 'status-format[1]' "#[align=centre]#{T:status-left}#{T:status-right}#[align=right]#{E:@_mode_tag}"

# --- line 0 (top): the window (tab) list, full width, centered ---
# tmux 3.7's status-format[0]/[1]/[2] default to "everything in one line" / a *pane* list /
# a *session* list respectively - none of that is what we want on either line, so both
# status-format[0] (here) and status-format[1] (above) are set explicitly. In a window showing
# a nested tmux the session is `status on` (see "Nested tmux" above), so only this line draws,
# and it becomes the 1-row strip holding just the mode tag.
#
# Agent state contract: agentmux (a TPM plugin, ~/projects/agentmux on this machine, cloned
# from GitHub elsewhere). Claude Code / Codex hooks write @agentmux_* PANE options, agentmux
# renders them into #{E:@agentmux_badge} / _label / _timer with zero forks, and owns the
# `prefix a` sidebar. It shows this server's agents only; a remote tmux shows its own. Its
# title and sidebar-skip options are set in "Nested tmux" above. Full contract:
# ~/projects/agentmux/docs/CONTRACT.md. The badge ladder is blocked > done > delegating
# (sub-agents still running after the main turn ended) > working > idle; `done` clears to
# idle once you look at the window. Nothing below polls.
set -g @plugin '1henrypage/agentmux'
set -g @agentmux_width 46
set -g @agentmux_key a
set -g @agentmux_color_blocked    "#fd6883"
set -g @agentmux_color_done       "#adda78"
set -g @agentmux_color_delegating "#a8a9eb"
set -g @agentmux_color_working    "#f38d70"
set -g @agentmux_color_idle       "#5b5353"
set -g @agentmux_color_project    "#85dacc"
set -g @agentmux_color_agent      "#948a8b"
set -g @agentmux_color_text       "#fff1f3"
set -g @agentmux_color_fg         "#c3b7b8"
set -g @agentmux_color_dim        "#5b5353"
set -g @agentmux_color_sidebar_bg "#2c2525"
# Restore the sidebar renderer with the layout (its process name contains agentmux-sidebar).
set -g @resurrect-processes '~agentmux-sidebar'

set -g window-status-format "#{E:@agentmux_badge} #I #{E:@agentmux_label}#{E:@agentmux_timer}"
set -g window-status-current-format "#[bg=#2c2525,bold] #{E:@agentmux_badge} #I #{E:@agentmux_label}#{E:@agentmux_timer} #[bg=#403838,nobold]"
set -g window-status-separator "    "

# `range=window|...` markers carried over from tmux's own default status-format[0] verbatim -
# drop them and prefix+click / mouse tab-select breaks (`set -g mouse on` above).
set -g @_sb_windows "#[align=centre]#[list=on align=centre]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index}]#{T:window-status-format}#[norange]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index}]#{T:window-status-current-format}#[norange]#{?loop_last_flag,,#{E:window-status-separator}}}"
set -g 'status-format[0]' "#{?$NESTED,#[align=right]#{E:@_mode_tag},#{E:@_sb_windows}}"

# --- Hint-based copy/open (Vimium-style, prefix+F) ---
set -g @plugin 'Morantron/tmux-fingers'

# Import TPM
run '~/.tmux/plugins/tpm/tpm'
