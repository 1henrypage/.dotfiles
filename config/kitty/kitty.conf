# vim:ft=kitty

## Monokai Pro Ristretto


macos_option_as_alt left

# Hide the macOS title bar (keeps rounded corners + traffic-light buttons)
hide_window_decorations titlebar-only


# Background and foreground
background #403838
foreground #fff1f3

# Cursor
cursor #fff1f3
cursor_text_color #403838

# Selection
selection_background #72696a
selection_foreground #fff1f3

# Tabs & window borders
active_tab_background #f38d70
active_tab_foreground #191515
inactive_tab_background #2c2525
inactive_tab_foreground #c3b7b8
active_border_color #f38d70
inactive_border_color #2c2525

# Normal colors
color0  #403838
color1  #fd6883
color2  #adda78
color3  #f9cc6c
color4  #f38d70
color5  #a8a9eb
color6  #85dacc
color7  #fff1f3

# Bright colors
color8  #72696a
color9  #fd6883
color10 #adda78
color11 #f9cc6c
color12 #f38d70
color13 #a8a9eb
color14 #85dacc
color15 #fff1f3



disable_ligatures never

# Experimental
# background_image ./static/bg.png
# Solid background keeps the terminal and editor palette identical in every window.
background_opacity 1.0
background_blur 0
dynamic_background_opacity no

# Font
font_family FantasqueSansM Nerd Font Mono
font_size 16.0

# Force windows/tabs through tmux (no native kitty tabs)
map cmd+t       no_op
map cmd+shift+] no_op
map cmd+shift+[ no_op
map cmd+1 no_op
map cmd+2 no_op
map cmd+3 no_op
map cmd+4 no_op
map cmd+5 no_op
map cmd+6 no_op
map cmd+7 no_op
map cmd+8 no_op
map cmd+9 no_op
# Newline without sending
map shift+enter send_text all \x1b\r
tab_bar_style hidden

# No `shell` override here on purpose. Setting it to tmux opts out of kitty's login-shell
# resolution, so kitty execs with the raw launchd GUI PATH and cannot find tmux (this is the
# "failed to launch child: tmux" bug). kitty runs the login shell; .zshrc execs into tmux.

# Replace (not append) the clipboard on OSC52 writes from tmux.
clipboard_control write-clipboard write-primary no-append

# aerospace's ctrl-alt-enter spawns each new terminal as a separate kitty instance
# (`open -na`). Without this, every one of those instances keeps running (and squatting in
# the dock) after its window closes - they pile up into dozens of ghost kitty icons. With
# it, an instance quits itself when its last window closes; applies to every instance
# started after this line lands, since each reads kitty.conf at startup.
macos_quit_when_last_window_closed yes






